<div style="width: 1100px; height: 700px; box-sizing: border-box; background: #0D141B; color: #E8EEF3; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 36px; padding-left: 16px; display: flex; align-items: center; justify-content: space-between; background: #0A1016; border-bottom: 1px solid #1A2530">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #93A3B3">
<svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6FD6C8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 21V9M12 9l-5-5M12 9l5-5M12 14l-4-3M12 14l4-3"></path></svg>Quantway</div>
<div style="display: flex">
<button aria-label="Свернуть" style="width: 46px; height: 36px; border: 0; background: transparent; color: #93A3B3"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" aria-hidden="true"><path d="M1 5h8" stroke="currentColor"></path></svg></button>
<button aria-label="Закрыть" style="width: 46px; height: 36px; border: 0; background: transparent; color: #93A3B3"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor"></path></svg></button>
</div>
</div>

<div style="flex: 1; display: flex; min-height: 0">

<nav style="width: 220px; background: #111B23; border-right: 1px solid #1A2530; padding: 20px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<a href="P0-Connect.dc.html" style="height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; background: #1A2833; color: #E8EEF3; text-decoration: none; font-size: 14px; font-weight: 700">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6FD6C8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>Главная</a>
<a href="P0-TincCountries.dc.html" style="height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; color: #93A3B3; text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>Маршруты</a>
<a href="Cabinet.dc.html" style="height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; color: #93A3B3; text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Кабинет</a>
<div style="flex: 1"></div>
<div style="padding: 12px; border-radius: 12px; background: #0D141B; border: 1px solid #1A2530; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><span style="{{dotStyle}}"></span><span style="font-size: 13px; font-weight: 700">{{shortStatus}}</span></div>
<span style="font-size: 12px; color: #93A3B3">{{subLine}}</span>
</div>
</nav>

<main style="flex: 1; padding: 28px 32px; display: flex; gap: 24px; min-width: 0">

<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Главная</h1>
<div style="display: flex; padding: 4px; background: #131D26; border: 1px solid #1F2C38; border-radius: 12px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button sc-camel-on-click="{{m.pick}}" disabled="{{m.disabled}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1; background: #111B23; border: 1px solid #1A2530; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; box-sizing: border-box">
<span style="font-size: 13px; color: #93A3B3">{{route}}</span>
<button sc-camel-on-click="{{main}}" aria-label="{{mainLabel}}" style="{{ringStyle}}">
<div style="{{coreStyle}}">
<sc-if value="{{icPower}}" hint-placeholder-val="{{ true }}"><svg width="52" height="52" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg></sc-if>
<sc-if value="{{icBusy}}" hint-placeholder-val="{{ false }}"><svg width="52" height="52" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9"></path><circle cx="12" cy="12" r="1.5"></circle></svg></sc-if>
<sc-if value="{{icLock}}" hint-placeholder-val="{{ false }}"><svg width="52" height="52" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></sc-if>
<sc-if value="{{icAlert}}" hint-placeholder-val="{{ false }}"><svg width="52" height="52" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg></sc-if>
</div>
</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 460px; text-align: center">
<span style="{{titleStyle}}">{{title}}</span>
<span style="font-size: 14px; line-height: 1.45; color: #93A3B3">{{sub}}</span>
</div>
<sc-if value="{{hasExtra}}" hint-placeholder-val="{{ false }}">
<div style="max-width: 460px; padding: 12px 14px; background: #0D141B; border: 1px solid #22323F; border-radius: 12px; font-size: 13px; line-height: 1.5; color: #C5D0DA">{{extra}}</div>
</sc-if>
<div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="2">
<sc-if value="{{a.isLink}}" hint-placeholder-val="{{ false }}"><a href="{{a.href}}" style="{{a.style}}">{{a.label}}</a></sc-if>
<sc-if value="{{a.isBtn}}" hint-placeholder-val="{{ true }}"><button sc-camel-on-click="{{a.go}}" disabled="{{a.disabled}}" style="{{a.style}}">{{a.label}}</button></sc-if>
</sc-for>
</div>
</div>
</div>

<aside style="width: 280px; display: flex; flex-direction: column; gap: 14px">
<div style="margin-top: 52px; padding: 16px; background: #111B23; border: 1px solid #1A2530; border-radius: 14px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; font-weight: 800">Сейчас</span>
<sc-for list="{{now}}" as="n" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px">
<span style="{{n.dot}}"></span>
<span style="flex: 1; font-size: 13px; color: #93A3B3">{{n.k}}</span>
<span style="font-size: 13px; font-weight: 700">{{n.v}}</span>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="padding: 14px; background: #111B23; border: 1px solid #1A2530; border-radius: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #93A3B3">{{s.k}}</span><span style="font-size: 18px; font-weight: 800">{{s.v}}</span></div>
</sc-for>
</div>
<span style="font-size: 12px; line-height: 1.45; color: #93A3B3">{{statsNote}}</span>
</aside>

</main>
</div>
</div>
