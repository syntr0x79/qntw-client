<div style="{{rootStyle}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 38px; font-weight: 800">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #93A3B3; max-width: 1200px">{{lead}}</p>
</div>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 800; color: #6FD6C8; text-transform: uppercase; letter-spacing: 0.08em">{{s.name}}</span>
<span style="font-size: 14px; color: #93A3B3; max-width: 1200px; line-height: 1.5">{{s.note}}</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; align-items: start">
<sc-for list="{{s.cards}}" as="c" hint-placeholder-count="4">
<div style="padding: 20px; background: #111B23; border: 1px solid #1A2530; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 700; color: #93A3B3; font-family: ui-monospace, Menlo, monospace">{{c.id}}</span>
<span style="font-size: 17px; font-weight: 800">{{c.title}}</span>
</div>
<sc-for list="{{c.blocks}}" as="b" hint-placeholder-count="3">
<sc-if value="{{b.isT}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; line-height: 1.5; color: #C5D0DA; white-space: pre-line">{{b.text}}</span></sc-if>
<sc-if value="{{b.isM}}" hint-placeholder-val="{{ false }}"><div style="{{b.box}}"><span style="{{b.dot}}"></span><span style="font-size: 13px; line-height: 1.5">{{b.text}}</span></div></sc-if>
<sc-if value="{{b.isKv}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: #0D141B; border-radius: 10px"><sc-for list="{{b.rows}}" as="r" hint-placeholder-count="2"><div style="display: flex; gap: 12px; font-size: 13px"><span style="color: #93A3B3; flex-shrink: 0">{{r.k}}</span><span style="{{r.vs}}">{{r.v}}</span></div></sc-for></div></sc-if>
<sc-if value="{{b.isIn}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">{{b.label}}</span><div style="{{b.box}}">{{b.value}}</div><span style="{{b.hs}}">{{b.hint}}</span></div></sc-if>
<sc-if value="{{b.isB}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{b.items}}" as="a" hint-placeholder-count="2"><span style="{{a.s}}">{{a.l}}</span></sc-for></div></sc-if>
<sc-if value="{{b.isLi}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px"><sc-for list="{{b.items}}" as="i" hint-placeholder-count="2"><div style="{{i.s}}"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; overflow-wrap: anywhere">{{i.t}}</span><span style="font-size: 12px; color: #93A3B3">{{i.sub}}</span></span><span style="{{i.rs}}">{{i.r}}</span></div></sc-for></div></sc-if>
<sc-if value="{{b.isBar}}" hint-placeholder-val="{{ false }}"><div style="height: 6px; border-radius: 3px; background: #1F2C38; overflow: hidden"><div style="{{b.fill}}"></div></div></sc-if>
<sc-if value="{{b.isChat}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #0D141B; border-radius: 10px"><sc-for list="{{b.items}}" as="m" hint-placeholder-count="2"><div style="{{m.s}}">{{m.text}}</div></sc-for></div></sc-if>
<sc-if value="{{b.isPh}}" hint-placeholder-val="{{ false }}"><div style="{{b.box}}">{{b.text}}</div></sc-if>
<sc-if value="{{b.isTb}}" hint-placeholder-val="{{ false }}"><div style="height: 36px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; background: #0A1016; border: 1px solid #1A2530; border-radius: 8px; font-size: 12px; font-weight: 700; color: #93A3B3"><span style="display: flex; gap: 8px; align-items: center"><sc-if value="{{b.apple}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span></span></sc-if>{{b.left}}</span><span>{{b.right}}</span></div></sc-if>
</sc-for>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
