<div style="width: 1100px; height: 700px; box-sizing: border-box; background: #0D141B; color: #E8EEF3; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 36px; padding-left: 16px; display: flex; align-items: center; justify-content: space-between; background: #0A1016; border-bottom: 1px solid #1A2530">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #93A3B3">
<svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6FD6C8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 21V9M12 9l-5-5M12 9l5-5M12 14l-4-3M12 14l4-3"></path></svg>Quantway</div>
<div style="display: flex">
<button aria-label="Свернуть" style="width: 46px; height: 36px; border: 0; background: transparent; color: #93A3B3"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" aria-hidden="true"><path d="M1 5h8" stroke="currentColor"></path></svg></button>
<button aria-label="Закрыть" style="width: 46px; height: 36px; border: 0; background: transparent; color: #93A3B3"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor"></path></svg></button>
</div>
</div>

<div style="flex: 1; display: flex; min-height: 0">

<nav style="width: 220px; background: #111B23; border-right: 1px solid #1A2530; padding: 20px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<a href="Home.dc.html" style="height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; color: #93A3B3; text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>Главная</a>
<a href="Routes.dc.html" style="height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; background: #1A2833; color: #E8EEF3; text-decoration: none; font-size: 14px; font-weight: 700">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6FD6C8" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>Маршруты</a>
<a href="Cabinet.dc.html" style="height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; color: #93A3B3; text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Кабинет</a>
<div style="flex: 1"></div>
<div style="padding: 12px; border-radius: 12px; background: #0D141B; border: 1px solid #1A2530; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #6FD6C8"></span><span style="font-size: 13px; font-weight: 700">Подключено</span></div>
<span style="font-size: 12px; color: #93A3B3">Подписка до 26 ноября</span>
</div>
</nav>

<main style="flex: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Маршруты</h1>
<span style="font-size: 13px; color: #93A3B3">{{checkedText}}</span>
</div>
<button sc-camel-on-click="{{check}}" style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border: 1px solid #2A3A48; border-radius: 10px; background: #131D26; color: #E8EEF3; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">
<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6FD6C8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>Проверить все</button>
</div>

<div style="display: flex; gap: 10px; align-items: center">
<label style="flex: 1; height: 42px; padding: 0 14px; display: flex; align-items: center; gap: 10px; background: #131D26; border: 1px solid #22323F; border-radius: 10px; color: #93A3B3">
<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
<input placeholder="Страна, город или протокол" style="flex: 1; border: 0; background: transparent; color: #E8EEF3; font: inherit; font-size: 14px; outline: none">
</label>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button sc-camel-on-click="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: 1fr 160px 120px 110px; gap: 12px; padding: 0 16px; font-size: 12px; font-weight: 700; color: #93A3B3; text-transform: uppercase; letter-spacing: 0.06em">
<span>Маршрут</span><span>Протокол</span><span>Пинг</span><span></span>
</div>

<div style="flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: auto">
<sc-for list="{{routes}}" as="r" hint-placeholder-count="6">
<div style="{{r.rowStyle}}">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #172430; color: #C5D0DA; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">{{r.code}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; color: #93A3B3">{{r.note}}</span></span>
</div>
<span style="font-size: 13px; color: #C5D0DA">{{r.proto}}</span>
<span style="{{r.pingStyle}}">{{r.ping}}</span>
<button sc-camel-on-click="{{r.pick}}" style="{{r.btnStyle}}">{{r.btnText}}</button>
</div>
</sc-for>
</div>
</main>
</div>
</div>
